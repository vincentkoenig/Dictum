# Einstellungen der Dictum-Desktop-App.
# Änderungen werden beim nächsten Start übernommen.

[hotkey]
# Taste(n), die gedrückt werden. Mehrere = gemeinsam drücken, z. B. ["win", "alt"].
#   Gruppen (links oder rechts): "ctrl", "win", "alt", "shift"
#   Genau eine Seite:            "ctrl_l", "ctrl_r", "alt_l", "shift_l", "shift_r"
#   Funktionstasten:             "f1" … "f12"
# Nicht empfohlen: "ctrl"+"alt" (= AltGr, z. B. für @ und €), "ctrl"+"shift"
# (wechselt oft das Tastaturlayout), "alt_r" (ist AltGr auf deutschen Tastaturen).
keys = ["ctrl_r"]

# "both"   = halten zum Sprechen ODER kurz antippen für Start/Stopp (empfohlen)
# "hold"   = nur halten (Push-to-talk)
# "toggle" = nur antippen (Start/Stopp)
mode = "both"

# Ab wie vielen Sekunden Drücken gilt es als "Halten" statt "Antippen"
hold_threshold = 0.4

[transcription]
# Wo die Sprache erkannt wird (im Tray-Menü umschaltbar):
#   "local"  = faster-whisper auf diesem PC – kostenlos, privat, ~2 s
#   "openai" = OpenAI-Cloud – braucht OPENAI_API_KEY in .env, kostet ~0,3 Cent/Minute
engine = "local"

# Modell für die OpenAI-Cloud-Transkription
openai_model = "gpt-4o-mini-transcribe"

# Lokales Whisper-Modell: "tiny", "base", "small", "medium", "large-v3-turbo"
# Größer = genauer, aber langsamer. "small" ist auf der CPU ein guter Kompromiss.
model = "small"

# Fester Sprachcode wie "de" oder "en", oder "auto" = automatisch erkennen.
# "auto" kostet pro Diktat ca. 1,5–2 s extra (Whisper analysiert dafür ein volles
# 30-s-Fenster). Englische Begriffe in deutschen Sätzen klappen auch mit "de".
# Im Tray-Menü jederzeit umschaltbar.
language = "de"

# Fällt die automatische Erkennung unsicher aus, wird diese Sprache genommen
fallback_language = "de"

[cleanup]
# KI-Bereinigung: Füllwörter raus, Selbstkorrekturen anwenden, Satzzeichen, Listen.
# Im Tray-Menü an/aus. Ohne Internet oder Key wird automatisch der Rohtext eingefügt.
enabled = true

# Wer bereinigt: "anthropic" (Claude) oder "openai"
provider = "anthropic"

# Schnelle, günstige Modelle – beim Diktieren zählt jede Zehntelsekunde
anthropic_model = "claude-haiku-5-5"
openai_model = "gpt-5-mini"

[cloud]
# Das Supabase-Projekt. Beides ist öffentlich und darf im Repo stehen: Der
# "publishable key" erlaubt nichts ohne Login, die Datenbank schützt sich per RLS.
# Login-Daten (E-Mail/Passwort) stehen dagegen in der .env.
url = "https://wmbafxknzbaogemacvdb.supabase.co"
publishable_key = "sb_publishable_kbWytftMtnkxLDoUZXYQwQ_T53gIvY_"

[meeting]
# Meetings am PC: Tray-Menü → "Meeting aufnehmen"
# PC-Ton (Teams, Zoom, Meet …) zusätzlich zum Mikrofon aufnehmen
include_system_audio = true
# Länge der Stücke, die einzeln hochgeladen und transkribiert werden
chunk_minutes = 5
# Lautstärke-Faktoren beim Mischen (1.0 = unverändert)
mic_gain = 1.0
system_gain = 0.8
# Wörterbuch und Snippets alle X Minuten mit der Cloud abgleichen (0 = nur beim Start)
sync_minutes = 15
# Adresse der Handy-/Web-App – dort werden fertige Meetings geöffnet
web_url = "https://vincentkoenig.github.io/Dictum/"

[history]
# Lokaler Verlauf deiner Diktate (nur auf diesem PC, nie in der Cloud). Sichtbar im Dictum-Fenster.
# Auf false stellen = es wird nichts gespeichert.
enabled = true
# Einträge, die älter sind, werden beim Start gelöscht (0 = nie löschen)
keep_days = 90

[feedback]
# Kurzer Piepton bei Start und Stopp der Aufnahme
sounds = true
