# Einstellungen der Dictum-Desktop-App.
# Änderungen werden beim nächsten Start übernommen.

[hotkey]
# Tasten, die gemeinsam gedrückt werden. Möglich: "ctrl", "win", "alt", "shift"
keys = ["ctrl", "win"]

# "both"   = halten zum Sprechen ODER kurz antippen für Start/Stopp (empfohlen)
# "hold"   = nur halten (Push-to-talk)
# "toggle" = nur antippen (Start/Stopp)
mode = "both"

# Ab wie vielen Sekunden Drücken gilt es als "Halten" statt "Antippen"
hold_threshold = 0.4

[transcription]
# Whisper-Modellgröße: "tiny", "base", "small", "medium", "large-v3-turbo"
# Größer = genauer, aber langsamer. "small" ist auf der CPU ein guter Kompromiss.
model = "small"

# Fester Sprachcode wie "de" oder "en", oder "auto" = automatisch erkennen.
# "auto" kostet pro Diktat ca. 1,5–2 s extra (Whisper analysiert dafür ein volles
# 30-s-Fenster). Englische Begriffe in deutschen Sätzen klappen auch mit "de".
# Im Tray-Menü jederzeit umschaltbar.
language = "de"

# Fällt die automatische Erkennung unsicher aus, wird diese Sprache genommen
fallback_language = "de"

[feedback]
# Kurzer Piepton bei Start und Stopp der Aufnahme
sounds = true
